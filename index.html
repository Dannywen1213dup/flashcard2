<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机单词卡</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: rgba(255,255,255,0.92);
      --text: #172033;
      --muted: #6b7280;
      --line: #dce2ec;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --star: #f59e0b;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(31, 41, 55, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,0.13), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(14,165,233,0.12), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr minmax(280px, 340px);
      grid-template-rows: 1fr auto;
      gap: 20px;
      min-height: 100vh;
      padding: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .input-panel {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 20px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: rgba(248,250,252,0.95);
      transition: border-color .2s, box-shadow .2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,0.10);
    }

    #wordInput {
      flex: 1;
      min-height: 220px;
      padding: 14px;
      line-height: 1.7;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s, background .15s, box-shadow .15s;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary-btn {
      flex: 1;
      padding: 12px 16px;
      color: white;
      font-weight: 750;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      box-shadow: 0 9px 22px rgba(79,70,229,0.26);
    }

    .secondary-btn {
      padding: 12px 14px;
      color: var(--text);
      background: #eef2ff;
      font-weight: 700;
      white-space: nowrap;
    }

    .stage {
      grid-column: 2;
      grid-row: 1 / 3;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      width: min(860px, 100%);
      gap: 12px;
    }

    .stat {
      padding: 14px 16px;
      border-radius: 16px;
      text-align: center;
      background: rgba(255,255,255,0.80);
      border: 1px solid rgba(255,255,255,0.95);
      box-shadow: 0 9px 30px rgba(31,41,55,0.07);
    }

    .stat-value {
      display: block;
      font-size: 23px;
      font-weight: 850;
    }

    .stat-label {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .card-wrap {
      position: relative;
      width: min(860px, 100%);
    }

    .word-card {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 360px;
      align-items: center;
      justify-content: center;
      padding: 60px 50px;
      overflow: hidden;
      text-align: center;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.98);
      border-radius: 30px;
      box-shadow: 0 26px 70px rgba(31,41,55,0.16);
      user-select: text;
    }

    .word-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(79,70,229,0.05), transparent 50%, rgba(14,165,233,0.05));
      pointer-events: none;
    }

    #wordDisplay {
      position: relative;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: clamp(38px, 6vw, 82px);
      font-weight: 850;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }

    .empty-text {
      color: #94a3b8;
      font-size: clamp(24px, 3vw, 38px) !important;
      font-weight: 650 !important;
      letter-spacing: 0 !important;
    }

    .star-badge {
      position: absolute;
      top: 20px;
      right: 24px;
      display: none;
      font-size: 36px;
      color: var(--star);
      filter: drop-shadow(0 5px 9px rgba(245,158,11,.25));
    }

    .word-card.starred .star-badge { display: block; }

    .timer-panel {
      display: flex;
      min-width: 330px;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 11px 15px 11px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 9px 30px rgba(31,41,55,0.08);
    }

    .timer-copy {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
    }

    .timer-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .timer-value {
      min-width: 52px;
      color: var(--primary);
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer-value.overtime { color: var(--danger); }

    .timer-unit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .auto-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .auto-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .auto-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .switch-track {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex: 0 0 auto;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #e2e8f0;
      box-shadow: inset 0 1px 2px rgba(15,23,42,.08);
      transition: background .2s, border-color .2s, box-shadow .2s;
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 7px rgba(15,23,42,.26);
      transition: transform .2s;
    }

    .auto-toggle input:checked + .switch-track {
      border-color: var(--primary);
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,.10);
    }

    .auto-toggle input:checked + .switch-track .switch-knob {
      transform: translateX(20px);
    }

    .auto-toggle input:focus-visible + .switch-track {
      outline: 3px solid rgba(79,70,229,.22);
      outline-offset: 2px;
    }

    .mobile-label,
    .mobile-tabbar {
      display: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn, .star-btn, .delete-btn {
      min-width: 116px;
      padding: 11px 18px;
      font-weight: 750;
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(31,41,55,.07);
    }

    .star-btn {
      color: #9a6700;
      background: #fff7db;
      border-color: #fde68a;
    }

    .delete-btn {
      color: #b91c1c;
      background: #fff1f2;
      border-color: #fecdd3;
    }

    .keyboard-hint {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    kbd {
      display: inline-block;
      min-width: 26px;
      margin: 0 2px;
      padding: 2px 7px;
      border: 1px solid #cbd5e1;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: white;
      color: #334155;
      font-size: 12px;
      font-family: inherit;
    }

    .unknown-panel {
      grid-column: 3;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 20px;
    }

    .unknown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .unknown-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .copy-btn {
      padding: 9px 12px;
      color: white;
      background: var(--primary);
      font-size: 13px;
      font-weight: 750;
    }

    #unknownList {
      flex: 1;
      min-height: 220px;
      padding: 13px;
      line-height: 1.65;
      background: #fffdf6;
      border-color: #fde7a8;
    }

    .unknown-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .small-btn {
      flex: 1 1 90px;
      padding: 10px 12px;
      color: #475569;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 700;
    }

    .status {
      min-height: 21px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1050px) and (min-width: 701px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .input-panel, .stage, .unknown-panel {
        grid-column: 1;
        grid-row: auto;
      }
      .input-panel, .unknown-panel { min-height: 430px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        min-height: 100dvh;
      }

      .app {
        display: block;
        width: 100%;
        height: 100dvh;
        min-height: 0;
        padding: 0 0 calc(70px + env(safe-area-inset-bottom));
      }

      .input-panel,
      .stage,
      .unknown-panel {
        display: none;
        width: 100%;
        height: calc(100dvh - 70px - env(safe-area-inset-bottom));
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .input-panel.mobile-active,
      .unknown-panel.mobile-active {
        display: flex;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .stage.mobile-active {
        display: flex;
      }

      .input-panel,
      .unknown-panel {
        padding: calc(18px + env(safe-area-inset-top)) 16px 18px;
        background: rgba(255,255,255,.94);
      }

      #wordInput,
      #unknownList {
        min-height: 250px;
      }

      .stage {
        justify-content: flex-start;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 12px 12px;
        overflow: hidden;
      }

      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        width: 100%;
        gap: 6px;
        flex: 0 0 auto;
      }

      .stat {
        min-width: 0;
        padding: 7px 3px;
        border-radius: 12px;
      }

      .stat-value {
        font-size: 16px;
        white-space: nowrap;
      }

      .stat-label {
        margin-top: 2px;
        overflow: hidden;
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-wrap {
        display: flex;
        width: 100%;
        min-height: 0;
        flex: 1 1 auto;
      }

      .word-card {
        width: 100%;
        min-height: 0;
        height: 100%;
        padding: 44px 20px;
        border-radius: 22px;
      }

      #wordDisplay {
        font-size: clamp(34px, 12vw, 64px);
      }

      .empty-text {
        font-size: clamp(21px, 7vw, 30px) !important;
      }

      .star-badge {
        top: 14px;
        right: 17px;
        font-size: 30px;
      }

      .timer-panel {
        width: 100%;
        min-width: 0;
        flex: 0 0 auto;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 12px 9px 15px;
        border-radius: 14px;
      }

      .timer-copy {
        gap: 5px;
      }

      .timer-label,
      .timer-unit,
      .auto-label {
        font-size: 12px;
      }

      .timer-value {
        min-width: 43px;
        font-size: 26px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
        flex: 0 0 auto;
        gap: 10px;
      }

      .nav-btn,
      .star-btn {
        width: 100%;
        min-width: 0;
        height: 56px;
        padding: 0;
        border-radius: 16px;
        font-size: 27px;
      }

      .star-btn {
        font-size: 29px;
      }

      .delete-btn,
      .keyboard-hint,
      .desktop-label {
        display: none;
      }

      .mobile-label {
        display: inline;
      }

      .mobile-tabbar {
        position: fixed;
        z-index: 50;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        height: calc(70px + env(safe-area-inset-bottom));
        padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(203,213,225,.9);
        background: rgba(255,255,255,.94);
        box-shadow: 0 -10px 30px rgba(15,23,42,.08);
        backdrop-filter: blur(18px);
      }

      .mobile-tab {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 5px 2px;
        border-radius: 12px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        font-weight: 750;
      }

      .mobile-tab-icon {
        font-size: 19px;
        line-height: 1;
      }

      .mobile-tab.active {
        color: var(--primary);
        background: #eef2ff;
      }

      .button-row {
        padding-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel input-panel" data-mobile-page="words">
      <h1 class="title">单词列表</h1>
      <p class="hint">一行一个单词卡。中英词卡建议按“英文一行、中文一行”排列；随机时会自动整对打乱。</p>
      <textarea id="wordInput" spellcheck="false" placeholder="例如：\nabandon\nmeticulous\na blessing in disguise"></textarea>
      <div class="button-row">
        <button id="loadBtn" class="primary-btn" type="button">加载并随机抽选 →</button>
        <button id="orderBtn" class="secondary-btn" type="button" title="从第一行开始按顺序出卡">顺序出卡</button>
        <button id="pairShuffleBtn" class="secondary-btn" type="button" title="严格按每两行一组进行随机排列">中英成对打乱</button>
      </div>
      <div id="loadStatus" class="status"></div>
    </section>

    <section class="stage mobile-active" data-mobile-page="home">
      <div class="stats" aria-label="学习统计">
        <div class="stat">
          <span id="totalCount" class="stat-value">0</span>
          <span class="stat-label">一共多少词</span>
        </div>
        <div class="stat">
          <span id="currentCount" class="stat-value">0 / 0</span>
          <span class="stat-label">当前预览</span>
        </div>
        <div class="stat">
          <span id="starredCount" class="stat-value">0</span>
          <span class="stat-label">已星标</span>
        </div>
        <div class="stat">
          <span id="unstarredCount" class="stat-value">0</span>
          <span class="stat-label">未星标</span>
        </div>
      </div>

      <div class="card-wrap">
        <article id="wordCard" class="word-card" aria-live="polite">
          <span class="star-badge" aria-hidden="true">★</span>
          <div id="wordDisplay" class="empty-text">请先在左侧输入内容并点击加载</div>
        </article>
      </div>

      <div class="timer-panel" aria-label="当前单词计时与自动星标">
        <div class="timer-copy">
          <span class="timer-label">当前词倒计时</span>
          <span id="timerDisplay" class="timer-value">10</span>
          <span class="timer-unit">秒</span>
        </div>
        <label class="auto-toggle" for="autoToggle" title="开启后，倒计时到 0 时自动给当前卡片添加星标">
          <span class="auto-label">Auto</span>
          <input id="autoToggle" type="checkbox" role="switch" aria-label="倒计时结束自动星标">
          <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        </label>
      </div>

      <div class="controls">
        <button id="prevBtn" class="nav-btn" type="button" aria-label="上一个">
          <span class="desktop-label">− / ← 上一个</span><span class="mobile-label" aria-hidden="true">←</span>
        </button>
        <button id="starBtn" class="star-btn" type="button" aria-label="星标或取消星标">
          <span class="desktop-label">Esc / ⌫ / W 星标</span><span class="mobile-label" aria-hidden="true">★</span>
        </button>
        <button id="deleteBtn" class="delete-btn" type="button">C 删除</button>
        <button id="nextBtn" class="nav-btn" type="button" aria-label="下一个">
          <span class="desktop-label">下一个 = / →</span><span class="mobile-label" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="keyboard-hint">
        <kbd>Esc</kbd><kbd>⌫</kbd><kbd>W</kbd> 星标 / 取消星标　
        <kbd>C</kbd> 删除当前卡片　
        <kbd>−</kbd><kbd>←</kbd><kbd>↑</kbd> 上一个　
        <kbd>=</kbd><kbd>→</kbd><kbd>↓</kbd> 下一个
      </div>
    </section>

    <section class="panel unknown-panel" data-mobile-page="unknown">
      <div class="unknown-header">
        <h2 class="unknown-title">不会的 List ★</h2>
        <button id="copyBtn" class="copy-btn" type="button">复制全部</button>
      </div>
      <textarea id="unknownList" readonly="" spellcheck="false" placeholder="按 W 星标的内容会出现在这里，每行一个。"></textarea>
      <div class="unknown-actions">
        <button id="addChineseBtn" class="small-btn" type="button" title="给已星标英文自动补上其下一行中文">一键加中文</button>
        <button id="selectBtn" class="small-btn" type="button">全选文本</button>
        <button id="clearStarsBtn" class="small-btn" type="button">清空星标</button>
      </div>
      <div id="copyStatus" class="status"></div>
    </section>
  </main>

  <nav class="mobile-tabbar" aria-label="手机端页面切换">
    <button class="mobile-tab" type="button" data-tab-target="words" aria-label="打开单词列表" aria-current="false">
      <span class="mobile-tab-icon" aria-hidden="true">☰</span>
      <span>单词列表</span>
    </button>
    <button class="mobile-tab active" type="button" data-tab-target="home" aria-label="打开主页" aria-current="page">
      <span class="mobile-tab-icon" aria-hidden="true">▣</span>
      <span>主页</span>
    </button>
    <button class="mobile-tab" type="button" data-tab-target="unknown" aria-label="打开不会的列表" aria-current="false">
      <span class="mobile-tab-icon" aria-hidden="true">★</span>
      <span>不会的 List</span>
    </button>
  </nav>

  <script>
    (() => {
      const wordInput = document.getElementById('wordInput');
      const loadBtn = document.getElementById('loadBtn');
      const orderBtn = document.getElementById('orderBtn');
      const pairShuffleBtn = document.getElementById('pairShuffleBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const starBtn = document.getElementById('starBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const copyBtn = document.getElementById('copyBtn');
      const addChineseBtn = document.getElementById('addChineseBtn');
      const selectBtn = document.getElementById('selectBtn');
      const clearStarsBtn = document.getElementById('clearStarsBtn');
      const wordDisplay = document.getElementById('wordDisplay');
      const wordCard = document.getElementById('wordCard');
      const unknownList = document.getElementById('unknownList');
      const totalCount = document.getElementById('totalCount');
      const currentCount = document.getElementById('currentCount');
      const starredCount = document.getElementById('starredCount');
      const unstarredCount = document.getElementById('unstarredCount');
      const loadStatus = document.getElementById('loadStatus');
      const copyStatus = document.getElementById('copyStatus');
      const timerDisplay = document.getElementById('timerDisplay');
      const autoToggle = document.getElementById('autoToggle');
      const mobilePages = [...document.querySelectorAll('[data-mobile-page]')];
      const mobileTabs = [...document.querySelectorAll('[data-tab-target]')];
      const mobileMedia = window.matchMedia('(max-width: 700px)');

      let sourceCards = [];
      let deck = [];
      let currentIndex = -1;
      let mode = 'random';
      let timerValue = 10;
      let timerInterval = null;
      let autoHandledCardId = null;
      const starredIds = new Set();

      try {
        autoToggle.checked = localStorage.getItem('wordcard-auto-star') === 'true';
      } catch (_) {}

      function createId(index) {
        return `${Date.now()}-${index}-${Math.random().toString(36).slice(2)}`;
      }

      function parseLines(text) {
        return text
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(Boolean)
          .map((text, index) => ({ id: createId(index), text }));
      }

      function shuffle(array) {
        const result = [...array];
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function containsChinese(text) {
        return /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(text);
      }

      function hasEnglishChinesePairs(cards) {
        if (cards.length < 2) return false;
        let completePairs = 0;
        let matchingPairs = 0;

        for (let i = 0; i + 1 < cards.length; i += 2) {
          completePairs += 1;
          const englishCard = cards[i];
          const chineseCard = cards[i + 1];
          if (!containsChinese(englishCard.text) && containsChinese(chineseCard.text)) {
            matchingPairs += 1;
          }
        }

        return completePairs > 0 && matchingPairs === completePairs;
      }

      function shuffleInPairs(cards) {
        const chunks = [];
        for (let i = 0; i < cards.length; i += 2) {
          chunks.push(cards.slice(i, i + 2));
        }
        return shuffle(chunks).flat();
      }

      function smartShuffle(cards) {
        return hasEnglishChinesePairs(cards) ? shuffleInPairs(cards) : shuffle(cards);
      }

      function currentCard() {
        return currentIndex >= 0 ? deck[currentIndex] : null;
      }

      function updateTimerDisplay() {
        timerDisplay.textContent = timerValue;
        timerDisplay.classList.toggle('overtime', timerValue < 0);
      }

      function stopTimer() {
        if (timerInterval !== null) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function applyAutoStarIfNeeded() {
        const card = currentCard();
        if (!card || !autoToggle.checked || timerValue > 0 || autoHandledCardId === card.id) return;
        starredIds.add(card.id);
        autoHandledCardId = card.id;
        render();
      }

      function resetTimer() {
        stopTimer();
        timerValue = 10;
        autoHandledCardId = null;
        updateTimerDisplay();
        if (!currentCard()) return;
        timerInterval = setInterval(() => {
          timerValue -= 1;
          updateTimerDisplay();
          applyAutoStarIfNeeded();
        }, 1000);
      }

      function switchMobileTab(pageName) {
        mobilePages.forEach(page => {
          page.classList.toggle('mobile-active', page.dataset.mobilePage === pageName);
        });
        mobileTabs.forEach(tab => {
          const isActive = tab.dataset.tabTarget === pageName;
          tab.classList.toggle('active', isActive);
          tab.setAttribute('aria-current', isActive ? 'page' : 'false');
        });
      }

      function showHomeOnMobile() {
        if (mobileMedia.matches) switchMobileTab('home');
      }

      function render() {
        const card = currentCard();
        const starredCards = sourceCards.filter(item => starredIds.has(item.id));

        totalCount.textContent = deck.length;
        currentCount.textContent = deck.length ? `${currentIndex + 1} / ${deck.length}` : '0 / 0';
        starredCount.textContent = starredCards.length;
        unstarredCount.textContent = Math.max(0, deck.length - starredCards.length);
        unknownList.value = starredCards.map(item => item.text).join('\n');

        if (!card) {
          wordDisplay.textContent = '请先在左侧输入内容并点击加载';
          wordDisplay.classList.add('empty-text');
          wordCard.classList.remove('starred');
          return;
        }

        wordDisplay.textContent = card.text;
        wordDisplay.classList.remove('empty-text');
        wordCard.classList.toggle('starred', starredIds.has(card.id));
      }

      function readInputAsSource(preserveWhenSame = false) {
        const parsed = parseLines(wordInput.value);
        const isSameList = parsed.length === sourceCards.length &&
          parsed.every((item, index) => item.text === sourceCards[index].text);

        if (preserveWhenSame && isSameList) {
          return;
        }

        sourceCards = parsed;
        starredIds.clear();
        copyStatus.textContent = '';
      }

      function loadWords() {
        readInputAsSource();
        mode = 'random';
        deck = smartShuffle(sourceCards);
        currentIndex = deck.length ? 0 : -1;
        const paired = hasEnglishChinesePairs(sourceCards);
        loadStatus.textContent = deck.length
          ? `已加载 ${deck.length} 张卡片，${paired ? '检测到中英配对，已按两行一组随机排列。' : '已完成单卡随机排列。'}`
          : '没有检测到有效内容，请至少输入一行非空文字。';
        render();
        resetTimer();
        showHomeOnMobile();
      }

      function startInOrder() {
        readInputAsSource(true);
        mode = 'sequential';
        deck = [...sourceCards];
        currentIndex = deck.length ? 0 : -1;
        loadStatus.textContent = deck.length
          ? `已从头开始，按左侧列表顺序出卡，共 ${deck.length} 张。`
          : '没有检测到有效内容，请至少输入一行非空文字。';
        render();
        resetTimer();
        showHomeOnMobile();
      }

      function reshuffleInPairs() {
        readInputAsSource(true);
        if (!sourceCards.length) {
          loadStatus.textContent = '请先输入并加载单词列表。';
          render();
          return;
        }

        mode = 'paired-random';
        deck = shuffleInPairs(sourceCards);
        currentIndex = 0;
        const pairCount = Math.floor(sourceCards.length / 2);
        const hasSingleTail = sourceCards.length % 2 === 1;
        loadStatus.textContent = `已按每两行一组随机排列，共 ${pairCount} 组${hasSingleTail ? '，最后一行作为单独卡片保留' : ''}。`;
        render();
        resetTimer();
        showHomeOnMobile();
      }

      function addMatchedChinese() {
        if (!sourceCards.length) {
          readInputAsSource();
        }
        if (!sourceCards.length) {
          copyStatus.textContent = '左侧没有可匹配的内容。';
          render();
          return;
        }

        let added = 0;
        let matched = 0;
        for (let i = 0; i + 1 < sourceCards.length; i += 2) {
          const englishCard = sourceCards[i];
          const chineseCard = sourceCards[i + 1];
          if (!starredIds.has(englishCard.id) || !containsChinese(chineseCard.text)) continue;
          matched += 1;
          if (!starredIds.has(chineseCard.id)) {
            starredIds.add(chineseCard.id);
            added += 1;
          }
        }

        if (added > 0) {
          copyStatus.textContent = `已为 ${added} 个星标英文补上对应中文。`;
        } else if (matched > 0) {
          copyStatus.textContent = '对应中文已经全部在星标列表中。';
        } else {
          copyStatus.textContent = '没有找到“已星标英文 + 下一行中文”的配对。请确认左侧按英文一行、中文一行排列。';
        }
        render();
      }

      function move(delta) {
        if (!deck.length) return;
        currentIndex = (currentIndex + delta + deck.length) % deck.length;
        render();
        resetTimer();
      }

      function toggleStar() {
        const card = currentCard();
        if (!card) return;
        if (starredIds.has(card.id)) {
          starredIds.delete(card.id);
        } else {
          starredIds.add(card.id);
        }
        render();
      }

      function deleteCurrentCard() {
        const card = currentCard();
        if (!card) {
          loadStatus.textContent = '当前没有可以删除的卡片。';
          return;
        }

        const deletedText = card.text;
        starredIds.delete(card.id);
        sourceCards = sourceCards.filter(item => item.id !== card.id);
        deck.splice(currentIndex, 1);
        wordInput.value = sourceCards.map(item => item.text).join('\n');

        if (!deck.length) {
          currentIndex = -1;
        } else if (currentIndex >= deck.length) {
          currentIndex = deck.length - 1;
        }

        loadStatus.textContent = `已删除“${deletedText}”，左侧列表已同步更新。当前为${mode === 'sequential' ? '顺序' : '随机'}出卡。`;
        render();
        resetTimer();
      }

      async function copyUnknowns() {
        const text = unknownList.value;
        if (!text) {
          copyStatus.textContent = '当前没有星标内容。';
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          copyStatus.textContent = `已复制 ${starredIds.size} 行内容。`;
        } catch (_) {
          unknownList.focus();
          unknownList.select();
          const success = document.execCommand('copy');
          copyStatus.textContent = success ? `已复制 ${starredIds.size} 行内容。` : '复制失败，请手动全选复制。';
        }
      }

      function isTypingTarget(target) {
        return target instanceof HTMLTextAreaElement || target instanceof HTMLInputElement || target.isContentEditable;
      }

      mobileTabs.forEach(tab => {
        tab.addEventListener('click', () => switchMobileTab(tab.dataset.tabTarget));
      });

      autoToggle.addEventListener('change', () => {
        try {
          localStorage.setItem('wordcard-auto-star', String(autoToggle.checked));
        } catch (_) {}
        applyAutoStarIfNeeded();
      });

      loadBtn.addEventListener('click', loadWords);
      orderBtn.addEventListener('click', startInOrder);
      pairShuffleBtn.addEventListener('click', reshuffleInPairs);
      prevBtn.addEventListener('click', () => move(-1));
      nextBtn.addEventListener('click', () => move(1));
      starBtn.addEventListener('click', toggleStar);
      deleteBtn.addEventListener('click', deleteCurrentCard);
      copyBtn.addEventListener('click', copyUnknowns);
      addChineseBtn.addEventListener('click', addMatchedChinese);

      selectBtn.addEventListener('click', () => {
        unknownList.focus();
        unknownList.select();
        copyStatus.textContent = unknownList.value ? '已全选，可以按 Ctrl/Cmd + C 复制。' : '当前没有星标内容。';
      });

      clearStarsBtn.addEventListener('click', () => {
        starredIds.clear();
        copyStatus.textContent = '已清空全部星标。';
        render();
      });

      document.addEventListener('keydown', (event) => {
        if (isTypingTarget(event.target)) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;

        const key = event.key.toLowerCase();
        if (key === 'w' || event.key === 'Escape' || event.key === 'Backspace') {
          event.preventDefault();
          toggleStar();
          return;
        }

        if (key === 'c') {
          event.preventDefault();
          deleteCurrentCard();
          return;
        }

        if (event.key === '-' || event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
          event.preventDefault();
          move(-1);
          return;
        }

        if (event.key === '=' || event.key === 'ArrowRight' || event.key === 'ArrowDown') {
          event.preventDefault();
          move(1);
        }
      });

      switchMobileTab('home');
      render();
      updateTimerDisplay();
    })();
  </script>


</body></html>
